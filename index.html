<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StoreXGamerPKG - Portal Gamer Pro</title>
    <style>
        :root {
            --bg-color: #030712;
            --panel-bg: #0b1329;
            --panel-glass: rgba(11, 19, 41, 0.88);
            --neon-cyan: #00f0ff;
            --neon-purple: #b026ff;
            --neon-pink: #ff007f;
            --neon-cyan-glow: rgba(0, 240, 255, 0.5);
            --neon-purple-glow: rgba(176, 38, 255, 0.4);
            --text-color: #f8fafc;
            --text-dim: #94a3b8;
            --border-color: #1e293b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            background-image: 
                radial-gradient(circle at 10% 15%, rgba(176, 38, 255, 0.12) 0%, transparent 45%),
                radial-gradient(circle at 90% 85%, rgba(0, 240, 255, 0.12) 0%, transparent 45%);
        }

        header {
            background: var(--panel-glass);
            backdrop-filter: blur(12px);
            border-bottom: 2px solid var(--neon-cyan);
            box-shadow: 0 0 25px var(--neon-cyan-glow), inset 0 0 15px rgba(0, 240, 255, 0.1);
            padding: 1rem 2rem;
            position: sticky;
            top: 0;
            z-index: 100;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-area h1 {
            font-size: 1.5rem;
            color: #fff;
            text-shadow: 0 0 10px var(--neon-cyan), 0 0 20px var(--neon-purple);
            letter-spacing: 1.5px;
            font-weight: 900;
        }

        .nav-buttons {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .user-badge {
            font-size: 0.85rem;
            color: var(--neon-cyan);
            background: rgba(0, 240, 255, 0.1);
            padding: 5px 10px;
            border-radius: 4px;
            border: 1px solid var(--neon-cyan);
            display: none;
        }

        .btn-neon {
            background: linear-gradient(135deg, rgba(0, 240, 255, 0.15), rgba(176, 38, 255, 0.15));
            border: 1px solid var(--neon-cyan);
            color: var(--neon-cyan);
            padding: 8px 18px;
            border-radius: 6px;
            font-size: 0.95rem;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 0 10px var(--neon-cyan-glow);
            transition: all 0.3s ease;
        }

        .btn-neon:hover {
            background: var(--neon-cyan);
            color: var(--bg-color);
            box-shadow: 0 0 25px var(--neon-cyan), 0 0 40px var(--neon-purple);
            border-color: #fff;
            transform: translateY(-2px);
        }

        .container {
            flex: 1;
            padding: 2.5rem;
            max-width: 1400px;
            margin: 0 auto;
            width: 100%;
        }

        .hero-banner {
            background: linear-gradient(135deg, rgba(11, 19, 41, 0.9), rgba(30, 15, 50, 0.9));
            border: 1px solid var(--neon-purple);
            box-shadow: 0 0 30px var(--neon-purple-glow);
            border-radius: 16px;
            padding: 2.5rem;
            margin-bottom: 2.5rem;
            text-align: center;
        }

        .hero-banner h2 {
            font-size: 2.2rem;
            color: #fff;
            text-shadow: 0 0 15px var(--neon-cyan);
            margin-bottom: 10px;
        }

        .hero-banner p {
            color: var(--text-dim);
            font-size: 1.05rem;
            max-width: 700px;
            margin: 0 auto;
        }

        .categories-tabs {
            display: flex;
            gap: 12px;
            margin-bottom: 2rem;
            overflow-x: auto;
            padding-bottom: 5px;
        }

        .tab-btn {
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            color: var(--text-dim);
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.3s ease;
        }

        .tab-btn.active, .tab-btn:hover {
            background: rgba(0, 240, 255, 0.1);
            border-color: var(--neon-cyan);
            color: var(--neon-cyan);
            box-shadow: 0 0 12px var(--neon-cyan-glow);
        }

        .search-bar-container {
            margin-bottom: 2.5rem;
        }

        .search-bar-container input {
            width: 100%;
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 14px 20px;
            border-radius: 10px;
            outline: none;
            font-size: 1.05rem;
            transition: all 0.3s ease;
        }

        .search-bar-container input:focus {
            border-color: var(--neon-cyan);
            box-shadow: 0 0 15px var(--neon-cyan-glow);
        }

        .games-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 2rem;
            margin-bottom: 2.5rem;
        }

        .game-card {
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: all 0.3s ease;
            box-shadow: 0 8px 20px rgba(0,0,0,0.6);
            position: relative;
        }

        .game-card:hover {
            border-color: var(--neon-cyan);
            box-shadow: 0 0 25px var(--neon-cyan-glow), 0 0 15px var(--neon-purple-glow);
            transform: translateY(-6px);
        }

        .game-img-container {
            position: relative;
            width: 100%;
            height: 180px;
            background: #111;
        }

        .game-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .game-badge {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(3, 7, 18, 0.85);
            border: 1px solid var(--neon-pink);
            color: var(--neon-pink);
            padding: 4px 10px;
            font-size: 0.75rem;
            font-weight: 800;
            border-radius: 4px;
            text-transform: uppercase;
            box-shadow: 0 0 8px rgba(255, 0, 127, 0.4);
        }

        .game-info {
            padding: 20px;
            display: flex;
            flex-direction: column;
            flex: 1;
        }

        .game-title {
            font-size: 1.2rem;
            font-weight: 800;
            margin-bottom: 8px;
            color: var(--text-color);
        }

        .game-desc {
            font-size: 0.9rem;
            color: var(--text-dim);
            margin-bottom: 18px;
            flex: 1;
            line-height: 1.5;
        }

        .game-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: auto;
            border-top: 1px solid var(--border-color);
            padding-top: 12px;
        }

        .game-size {
            font-size: 0.85rem;
            color: var(--neon-cyan);
            font-weight: 700;
        }

        .btn-download {
            background: linear-gradient(135deg, var(--neon-cyan), var(--neon-purple));
            color: #030712;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            font-weight: 900;
            font-size: 0.9rem;
            cursor: pointer;
            text-decoration: none;
            box-shadow: 0 0 10px var(--neon-cyan-glow);
            transition: all 0.3s ease;
        }

        .btn-download:hover {
            box-shadow: 0 0 20px var(--neon-cyan), 0 0 20px var(--neon-purple);
            transform: scale(1.05);
            color: #fff;
        }

        .admin-actions {
            margin-top: 12px;
            display: flex;
            gap: 8px;
        }

        .btn-edit { background: #d97706; color: #fff; border:none; padding:6px 12px; border-radius:6px; font-size:0.8rem; cursor:pointer; font-weight:700; }
        .btn-delete { background: #dc2626; color: #fff; border:none; padding:6px 12px; border-radius:6px; font-size:0.8rem; cursor:pointer; font-weight:700; }

            backdrop-filter: blur(10px);
            border-top:
