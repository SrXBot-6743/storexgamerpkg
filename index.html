<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>STOREXGAMER PKG</title>
  <style>
    :root {
      --bg: #090c15;
      --card-bg: #121824;
      --card-hover: #1b2436;
      --accent-cyan: #00f0ff;
      --accent-pink: #ff0077;
      --text-main: #ffffff;
      --text-muted: #8e9bb0;
      --border-color: rgba(0, 240, 255, 0.2);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg);
      color: var(--text-main);
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      padding: 20px;
      min-height: 100vh;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 25px;
      background: linear-gradient(135deg, #121824, #0b0f19);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
      margin-bottom: 25px;
    }

    .logo {
      font-size: 26px;
      font-weight: 900;
      letter-spacing: 2px;
      background: linear-gradient(45deg, var(--accent-cyan), var(--accent-pink));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-transform: uppercase;
    }

    .search-box {
      width: 100%;
      margin-bottom: 30px;
    }

    .search-bar {
      width: 100%;
      padding: 15px 20px;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      color: #fff;
      font-size: 16px;
      outline: none;
      box-shadow: inset 0 2px 4px rgba(0,0,0,0.5);
    }

    .search-bar:focus {
      border-color: var(--accent-cyan);
      box-shadow: 0 0 10px rgba(0, 240, 255, 0.3);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 25px;
    }

    .card {
      background: var(--card-bg);
      border-radius: 14px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      border: 1px solid var(--border-color);
      transition: all 0.3s ease;
      position: relative;
    }

    .card:hover {
      transform: translateY(-5px);
      background: var(--card-hover);
      border-color: var(--accent-cyan);
      box-shadow: 0 8px 25px rgba(0, 240, 255, 0.2);
    }

    .card-img-wrapper {
      position: relative;
      width: 100%;
      height: 300px;
      overflow: hidden;
    }

    .card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .badge-platform {
      position: absolute;
      top: 10px;
      right: 10px;
      background: rgba(0, 0, 0, 0.75);
      border: 1px solid var(--accent-cyan);
      color: var(--accent-cyan);
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 800;
    }

    .card-body {
      padding: 18px;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
    }

    .card-title {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 8px;
      color: var(--text-main);
    }

    .card-meta {
      font-size: 13px;
      color: var(--text-muted);
      margin-bottom: 15px;
    }

    .download-btn {
      margin-top: auto;
      background: linear-gradient(135deg, #0070f3, #004499);
      color: white;
      text-align: center;
      padding: 10px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 700;
      font-size: 14px;
    }
  </style>
</head>
<body>

  <header>
    <div class="logo">STOREXGAMER PKG</div>
  </header>

  <div class="search-box">
    <input type="text" id="searchInput" class="search-bar" placeholder="Buscar por nombre o plataforma..." oninput="filtrarJuegos()">
  </div>

  <div class="grid" id="juegosContainer">
    <!-- Aquí puedes agregar tus juegos directamente en el código o mantenerlos -->
    <div class="card">
      <div class="card-img-wrapper">
        <img src="https://via.placeholder.com/240x300" alt="Juego de Ejemplo">
        <span class="badge-platform">PS4</span>
      </div>
      <div class="card-body">
        <h3 class="card-title">Ejemplo de Juego</h3>
        <div class="card-meta">💾 20 GB</div>
        <a href="#" class="download-btn">DESCARGAR PKG</a>
      </div>
    </div>
  </div>

  <script>
    // Aquí puedes pegar la lista de tus juegos estáticos si los tenías por código directo.
    function filtrarJuegos() {
      // Función de búsqueda local
    }
  </script>
</body>
</html>
