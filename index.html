<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#08060d">
<meta name="description" content="StoreXGamerPKG: comunidad gamer, juegos, aplicaciones y herramientas para todas las plataformas.">

<title>StoreXGamerPKG — Next-Gen Gaming Community</title>

<style>
:root {
    --bg: #08060d;
    --panel: #100d18;
    --line: #292035;
    --text: #f5f1fb;
    --muted: #a69bb5;
    --purple: #9b35ff;
    --pink: #d34dff;
    --lime: #c8ff4d;
    --cyan: #00ffcc;
}

* {
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    margin: 0;
    background:
        radial-gradient(ellipse at 75% -15%, #321052 0, transparent 34%),
        var(--bg);
    color: var(--text);
    font: 15px/1.5 Inter, system-ui, "Segoe UI", sans-serif;
}

a {
    color: inherit;
    text-decoration: none;
}

button, input, select, textarea {
    font: inherit;
}

button {
    cursor: pointer;
}

.wrap {
    width: min(1200px, calc(100% - 38px));
    margin: auto;
}

.topline {
    height: 3px;
    background: linear-gradient(90deg, #5b1ab4, #c13cff, #00ffcc);
}

header {
    position: sticky;
    top: 0;
    z-index: 20;
    background: #09070de8;
    backdrop-filter: blur(18px);
    border-bottom: 1px solid #ffffff12;
}

.nav {
    height: 76px;
    display: flex;
    align-items: center;
    gap: 28px;
}

.brand {
    display: flex;
    align-items: center;
    gap: 10px;
    min-width: max-content;
}

.brand img {
    width: 52px;
    height: 52px;
    object-fit: contain;
    filter: drop-shadow(0 0 12px #9b35ff55);
}

.brand strong {
    font-size: 16px;
    letter-spacing: .5px;
}

.brand small {
    display: block;
    color: var(--muted);
    font-size: 9px;
    letter-spacing: 2.4px;
}

.links {
    display: flex;
    gap: 24px;
    margin-left: auto;
    color: #c8bfd2;
    font-weight: 650;
    font-size: 13px;
}

.links a:hover {
    color: var(--cyan);
    text-shadow: 0 0 8px rgba(0,255,204,0.4);
}

.navright {
    display: flex;
    align-items: center;
    gap: 9px;
}

.searchbtn, .menuBtn {
    border: 1px solid var(--line);
    background: #15101e;
    color: white;
    border-radius: 11px;
    padding: 10px 13px;
}

.pill {
    border: 0;
    border-radius: 11px;
    padding: 11px 16px;
    background: linear-gradient(115deg, #8b2be8, #00ffcc);
    color: #0b0712;
    font-weight: 800;
    box-shadow: 0 8px 25px rgba(0,255,204,0.3);
    transition: 0.2s;
}
.pill:hover {
    filter: brightness(1.1);
    box-shadow: 0 8px 30px rgba(0,255,204,0.5);
}

.menuBtn {
    display: none;
}

/* BANNER PRINCIPAL */
.hero {
    padding: 30px 0 18px;
}

.heroBox {
    position: relative;
    min-height: 400px;
    overflow: hidden;
    border: 1px solid #ffffff1b;
    border-radius: 25px;
    background: linear-gradient(100deg, #0b0712 3%, #170c27 48%, #30104a 100%);
    box-shadow: 0 25px 80px #0008;
}

.heroBox:before {
    content: "";
    position: absolute;
    inset: 0;
    background:
        linear-gradient(90deg, #09060ff5 0%, #10091bdc 45%, #10091b30 100%),
        radial-gradient(circle at 78% 42%, #00ffcc33, transparent 35%);
}

.heroArt {
    position: absolute;
    right: 2%;
    top: 0;
    height: 100%;
    width: 58%;
    display: grid;
    place-items: center;
    font-size: clamp(110px, 22vw, 250px);
    opacity: .8;
    text-shadow: 0 0 45px rgba(0,255,204,0.4);
}

.heroContent {
    position: relative;
    z-index: 1;
    padding: 52px 5%;
    max-width: 650px;
}

.eyebrow {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    color: var(--cyan);
    font-size: 10px;
    font-weight: 900;
    letter-spacing: 2.5px;
}

.dot {
    width: 7px;
    height: 7px;
    background: var(--lime);
    border-radius: 50%;
    box-shadow: 0 0 12px var(--lime);
}

h1 {
    font-size: clamp(36px, 5vw, 61px);
    line-height: 1.02;
    letter-spacing: -2px;
    margin: 17px 0;
}

.gradient {
    background: linear-gradient(90deg, #fff, #00ffcc 70%, #9b35ff);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
}

.hero p {
    color: #c2b6d0;
    max-width: 490px;
    margin: 0 0 24px;
    font-size: 15px;
}

.actions {
    display: flex;
    gap: 11px;
    flex-wrap: wrap;
}

.outline {
    border: 1px solid #ffffff35;
    background: #ffffff0b;
    color: #fff;
    border-radius: 11px;
    padding: 11px 16px;
    font-weight: 750;
    transition: 0.2s;
}
.outline:hover {
    border-color: var(--cyan);
    color: var(--cyan);
}

/* ESTADÍSTICAS */
.stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    margin: 16px 0 35px;
}

.stat {
    border: 1px solid var(--line);
    background: #100c17;
    border-radius: 14px;
    padding: 14px 17px;
}

.stat b {
    display: block;
    font-size: 18px;
    color: var(--cyan);
}

.stat span {
    color: var(--muted);
    font-size: 11px;
}

/* SECCIONES */
.section {
    padding: 24px 0 36px;
}

.sectionHead {
    display: flex;
    justify-content: space-between;
    align-items: end;
    gap: 20px;
    margin-bottom: 18px;
}

.kicker {
    color: var(--cyan);
    font-size: 10px;
    font-weight: 900;
    letter-spacing: 2.5px;
}

.section h2 {
    font-size: 26px;
    letter-spacing: -.8px;
    margin: 3px 0 0;
}

.muted {
    color: var(--muted);
}

/* PLATAFORMAS */
.platforms {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 12px;
}

.platform {
    min-height: 112px;
    padding: 17px;
    border: 1px solid var(--line);
    border-radius: 16px;
    background: linear-gradient(145deg, #191225, #0e0b14);
    transition: .2s;
    cursor: pointer;
    display: block;
}

.platform:hover {
    transform: translateY(-4px);
    border-color: var(--cyan);
    box-shadow: 0 12px 35px rgba(0,255,204,0.15);
}

.platform .ico {
    font-size: 27px;
}

.platform strong {
    display: block;
    margin-top: 8px;
}

.platform small {
    color: var(--muted);
}

/* CATÁLOGO */
.toolbar {
    display: flex;
    gap: 9px;
    align-items: center;
    flex-wrap: wrap;
    margin-bottom: 16px;
}

.field {
    background: #100c17;
    border: 1px solid var(--line);
    color: white;
    border-radius: 10px;
    padding: 10px 12px;
    outline: none;
}

.field:focus {
    border-color: var(--cyan);
}

.toolbar input {
    flex: 1;
    min-width: 180px;
}

.cards {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 14px;
}

.card {
    border: 1px solid var(--line);
    border-radius: 16px;
    overflow: hidden;
    background: #100d17;
    transition: .2s;
    display: flex;
    flex-direction: column;
}

.card:hover {
    transform: translateY(-5px);
    border-color: var(--cyan);
    box-shadow: 0 16px 36px rgba(0,0,0,0.8);
}

.cover {
    height: 150px;
    position: relative;
    display: grid;
    place-items: center;
    background: radial-gradient(circle at 50% 40%, #4a1975, #170a24 55%, #0c0911);
    font-size: 50px;
}

.tag {
    position: absolute;
    z-index: 1;
    top: 11px;
    left: 11px;
    padding: 5px 8px;
    border-radius: 7px;
    background: #09060dcc;
    border: 1px solid rgba(0,255,204,0.3);
    font-size: 9px;
    font-weight: 900;
    letter-spacing: 1px;
    color: var(--cyan);
}

.cardBody {
    padding: 13px;
    display: flex;
    flex-direction: column;
    flex: 1;
}

.cardBody h3 {
    font-size: 14px;
    margin: 0 0 5px;
}

.cardBody p {
    font-size: 11px;
    color: var(--muted);
    margin: 0 0 12px;
    flex: 1;
}

.meta {
    display: flex;
    align-items: center;
    justify-content: space-between;
    color: #9e92ad;
    font-size: 10px;
    margin-top: auto;
}

.miniBtn {
    background: #152226;
    color: var(--cyan);
    border: 1px solid rgba(0,255,204,0.4);
    border-radius: 8px;
    padding: 6px 10px;
    font-size: 10px;
    font-weight: 800;
    transition: 0.2s;
}
.miniBtn:hover {
    background: var(--cyan);
    color: #0b0712;
}

/* COMUNIDAD */
.community {
    display: grid;
