<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#090812">
    <title>STOREXGAMER PKG — Portal Oficial & Panel Pro</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Rajdhani:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Favicon dinámico -->
    <link id="dynamicFavicon" rel="icon" type="image/svg+xml" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='64' height='64'><circle cx='32' cy='32' r='30' fill='%23090812' stroke='%238B35FF' stroke-width='4'/><text x='50%' y='55%' font-size='22' font-family='sans-serif' font-weight='900' fill='%2308D9D0' text-anchor='middle' dominant-baseline='middle'>SX</text></svg>">

    <style>
        :root {
            --bg-dark: #090812;
            --panel-dark: #11101C;
            --neon-purple: #8B35FF;
            --neon-cyan: #08D9D0;
            --text-light: #F5F2FF;
            --text-muted: #9691AA;
            --glow-cyan: rgba(8, 217, 208, 0.35);
            --glow-purple: rgba(139, 53, 255, 0.35);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-light);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        /* HEADER */
        header {
            background: rgba(17, 16, 28, 0.85);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(139, 53, 255, 0.2);
            padding: 1rem 2rem;
            position: sticky;
            top: 0;
            z-index: 100;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.5rem;
            font-weight: 900;
            background: linear-gradient(135deg, var(--neon-cyan), var(--neon-purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .nav-buttons {
            display: flex;
            gap: 1rem;
        }

        .btn {
            background: rgba(139, 53, 255, 0.15);
            border: 1px solid var(--neon-purple);
            color: var(--text-light);
            padding: 0.6rem 1.2rem;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .btn:hover {
            background: var(--neon-purple);
            box-shadow: 0 0 15px var(--glow-purple);
        }

        /* MAIN CONTENT */
        main {
            flex: 1;
            padding: 2rem;
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
        }

        .chat-card {
            background: var(--panel-dark);
            border: 1px solid rgba(8, 217, 208, 0.2);
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            height: 75vh;
        }

        .chat-header {
            background: rgba(255,255,255,0.03);
            padding: 1rem 1.5rem;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .assistant-info {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .avatar {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            border: 2px solid var(--neon-cyan);
            box-shadow: 0 0 10px var(--glow-cyan);
        }

        .chat-body {
            flex: 1;
            padding: 1.5rem;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .message {
            max-width: 80%;
            padding: 1rem;
            border-radius: 12px;
            line-height: 1.5;
        }

        .message.bot {
            background: rgba(139, 53, 255, 0.1);
            border: 1px solid rgba(139, 53, 255, 0.3);
            align-self: flex-start;
        }

        .message.user {
            background: rgba(8, 217, 208, 0.1);
            border: 1px solid rgba(8, 217, 208, 0.3);
            align-self: flex-end;
        }

        .chat-footer {
            padding: 1rem;
            background: rgba(0,0,0,0.2);
            display: flex;
            gap: 0.5rem;
        }

        .chat-input {
            flex: 1;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 8px;
            padding: 0.8rem 1rem;
            color: #fff;
            outline: none;
        }

        .chat-input:focus {
            border-color: var(--neon-cyan);
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">
            <i class="fa-solid fa-gamepad"></i> STOREXGAMER PKG
        </div>
        <div class="nav-buttons">
            <button class="btn" onclick="toggleAudio()"><i id="audioIcon" class="fa-solid fa-volume-high"></i> Voz</button>
            <button class="btn"><i class="fa-solid fa-sliders"></i> Panel Admin</button>
        </div>
    </header>

    <main>
        <div class="chat-card">
            <div class="chat-header">
                <div class="assistant-info">
                    <img src="https://api.dicebear.com/7.x/bottts/svg?seed=Hana" alt="Hana" class="avatar">
                    <div>
                        <h3 style="font-family: 'Orbitron'; font-size: 1.1rem; color: var(--neon-cyan);">HANA / SX ASSISTANT</h3>
                        <small style="color: var(--text-muted);">IA No Disponible — Modo Local</small>
                    </div>
                </div>
            </div>

            <div class="chat-body" id="chatBody">
                <div class="message bot">
                    <strong>¡Hola! Soy Hana ✦</strong><br>
                    Tu compañera gamer. Escríbeme o háblame: buscamos juegos, apps y novedades juntos.
                </div>
            </div>

            <div class="chat-footer">
                <input type="text" id="userInput" class="chat-input" placeholder="Escríbele a Hana..." onkeypress="handleKeyPress(event)">
                <button class="btn" onclick="enviarMensaje()"><i class="fa-solid fa-paper-plane"></i></button>
            </div>
        </div>
    </main>

    <!-- SCRIPT DE SÍNTESIS DE VOZ E INTERFAZ -->
    <script>
        // ==========================================
        // 1. CONFIGURACIÓN DE SÍNTESIS DE VOZ (TTS)
        // ==========================================
        let vozActivada = true;
        let vocesDisponibles = [];
        let usuarioInteractuo = false;

        // Desbloquear audio con la primera interacción del usuario
        function desbloquearAudio() {
            if (!usuarioInteractuo) {
                usuarioInteractuo = true;
                if ('speechSynthesis' in window) {
                    window.speechSynthesis.getVoices();
                }
            }
        }
        window.addEventListener('click', desbloquearAudio, { once: true });
        window.addEventListener('keydown', desbloquearAudio, { once: true });

        function cargarVocesHana() {
            if ('speechSynthesis' in window) {
                vocesDisponibles = window.speechSynthesis.getVoices();
            }
        }

        if ('speechSynthesis' in window) {
            cargarVocesHana();
            if (speechSynthesis.onvoiceschanged !== undefined) {
                speechSynthesis.onvoiceschanged = cargarVocesHana;
            }
        }

        function hablarHana(texto) {
            if (!vozActivada || !('speechSynthesis' in window)) return;
            window.speechSynthesis.cancel();

            // Limpiar etiquetas HTML y formato Markdown
            const textoLimpio = texto.replace(/<[^>]*>?/gm, '').replace(/[*_#`]/g, '');

            const utterance = new SpeechSynthesisUtterance(textoLimpio);
            utterance.lang = 'es-ES';
            utterance.rate = 1.0;
            utterance.pitch = 1.2;

            if (vocesDisponibles.length === 0) {
                vocesDisponibles = window.speechSynthesis.getVoices();
            }

            const vozEspanol = vocesDisponibles.find(v => v.lang.includes('es') || v.lang.includes('ES'));
            if (vozEspanol) {
                utterance.voice = vozEspanol;
            }

            window.speechSynthesis.speak(utterance);
        }

        // Alternar voz con el botón superior
        function toggleAudio() {
            vozActivada = !vozActivada;
            const icon = document.getElementById('audioIcon');
            if (vozActivada) {
                icon.className = 'fa-solid fa-volume-high';
                hablarHana("Voz de Hana activada");
            } else {
                icon.className = 'fa-solid fa-volume-xmark';
                window.speechSynthesis.cancel();
            }
        }

        // ==========================================
        // 2. LÓGICA DEL CHAT Y RESPUESTAS
        // ==========================================
        function enviarMensaje() {
            desbloquearAudio();
            const input = document.getElementById('userInput');
            const texto = input.value.trim();
            if (!texto) return;

            agregarMensajeChat('user', texto);
            input.value = '';

            // Respuesta por defecto (Modo local / Sin endpoint)
            setTimeout(() => {
                const respuestaHana = "No pude conectar con el servicio de IA. Revisa el endpoint en la configuración. Mientras tanto, puedo ayudarte con el catálogo.";
                
                // 1. Mostrar respuesta en pantalla
                agregarMensajeChat('bot', respuestaHana);
                
                // 2. Pronunciar respuesta en voz alta
                hablarHana(respuestaHana);
            }, 600);
        }

        function agregarMensajeChat(tipo, texto) {
            const chatBody = document.getElementById('chatBody');
            const div = document.createElement('div');
            div.className = `message ${tipo}`;
            div.innerHTML = texto;
            chatBody.appendChild(div);
            chatBody.scrollTop = chatBody.scrollHeight;
        }

        function handleKeyPress(e) {
            if (e.key === 'Enter') {
                enviarMensaje();
            }
        }
    </script>
</body>
</html>
