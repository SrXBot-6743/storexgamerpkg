<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>STOREXGAMER PKG</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg: #0a0e17;
      --card-bg: #161b26;
      --accent: #ff0055;
      --text: #ffffff;
      --text-dim: #9ea4c7;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      padding: 20px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0 30px;
      border-bottom: 2px solid var(--accent);
      margin-bottom: 30px;
    }

    .logo {
      font-size: 24px;
      font-weight: bold;
      color: var(--accent);
      letter-spacing: 2px;
    }

    .admin-btn {
      background: var(--accent);
      color: #fff;
      border: none;
      padding: 10px 18px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    .admin-btn:hover { opacity: 0.9; }

    .search-bar {
      width: 100%;
      padding: 12px 16px;
      background: var(--card-bg);
      border: 1px solid #2a3245;
      border-radius: 8px;
      color: #fff;
      margin-bottom: 30px;
      font-size: 16px;
      outline: none;
    }

    .search-bar:focus { border-color: var(--accent); }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 20px;
    }

    .card {
      background: var(--card-bg);
      border-radius: 10px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      border: 1px solid #2a3245;
    }

    .card img {
      width: 100%;
      height: 250px;
      object-fit: cover;
    }

    .card-body {
      padding: 15px;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
    }

    .card-title {
      font-size: 18px;
      margin-bottom: 8px;
    }

    .card-meta {
      font-size: 12px;
      color: var(--text-dim);
      margin-bottom: 12px;
    }

    .download-btn {
      margin-top: auto;
      background: #0070f3;
      color: white;
      text-align: center;
      padding: 8px;
      border-radius: 6px;
      text-decoration: none;
      font-weight: bold;
      font-size: 14px;
    }

    /* MODAL ADMIN */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.8);
      z-index: 1000;
      justify-content: center;
      align-items: center;
    }

    .modal-overlay.active { display: flex; }

    .modal-content {
      background: var(--card-bg);
      padding: 30px;
      border-radius: 10px;
      width: 100%;
      max-width: 450px;
      border: 1px solid var(--accent);
    }

    .modal-content h2 { margin-bottom: 20px; color: var(--accent); }

    .form-group { margin-bottom: 15px; }
    .form-group label { display: block; margin-bottom: 5px; font-size: 12px; color: var(--text-dim); }
    .form-group input, .form-group textarea {
      width: 100%;
      padding: 8px 12px;
      background: var(--bg);
      border: 1px solid #2a3245;
      color: #fff;
      border-radius: 4px;
      outline: none;
    }

    .btn-submit {
      width: 100%;
      padding: 10px;
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <header>
    <div class="logo">STOREXGAMER PKG</div>
    <button class="admin-btn" onclick="toggleModal(true)">+ Agregar Juego</button>
  </header>

  <input type="text" id="searchInput" class="search-bar" placeholder="Buscar juego..." oninput="filtrarJuegos()">

  <div class="grid" id="juegosContainer">
    <p style="color: var(--text-dim);">Cargando juegos...</p>
  </div>

  <!-- Modal Admin -->
  <div class="modal-overlay" id="adminModal">
    <div class="modal-content">
      <h2>Agregar Nuevo Juego</h2>
      <form id="gameForm" onsubmit="guardarJuego(event)">
        <div class="form-group">
          <label>ID Numérico:</label>
          <input type="number" id="gameId" required>
        </div>
        <div class="form-group">
          <label>Título:</label>
          <input type="text" id="gameTitle" required>
        </div>
        <div class="form-group">
          <label>Plataforma (PS4/PS5):</label>
          <input type="text" id="gamePlatform">
        </div>
        <div class="form-group">
          <label>Tamaño (GB):</label>
          <input type="text" id="gameSize">
        </div>
        <div class="form-group">
          <label>URL Carátula (Imagen):</label>
          <input type="url" id="gameImg">
        </div>
        <div class="form-group">
          <label>URL Descarga (PKG):</label>
          <input type="url" id="gameLink">
        </div>
        <div class="form-group">
          <label>Descripción:</label>
          <textarea id="gameDesc" rows="3"></textarea>
        </div>
        <button type="submit" class="btn-submit">Publicar Juego</button>
        <button type="button" class="btn-submit" style="background:#555; margin-top:10px;" onclick="toggleModal(false)">Cancelar</button>
      </form>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://boahzezjaxtgbvmttxho.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_0STgJcecj4JryhtoseK8Iw_Ktb8fd9q';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let juegosData = [];

    document.addEventListener('DOMContentLoaded', cargarJuegos);

    async function cargarJuegos() {
      const { data, error } = await supabaseClient
        .from('games')
        .select('*')
        .order('id', { ascending: false });

      if (error) {
        console.error('Error:', error);
        document.getElementById('juegosContainer').innerHTML = '<p>Error al cargar catálogo.</p>';
        return;
      }

      juegosData = data || [];
      renderizar(juegosData);
    }

    function renderizar(juegos) {
      const container = document.getElementById('juegosContainer');
      if (juegos.length === 0) {
        container.innerHTML = '<p>No hay juegos registrados.</p>';
        return;
      }

      container.innerHTML = juegos.map(juego => `
        <div class="card">
          <img src="${juego.imgUrl || 'https://via.placeholder.com/220x250'}" alt="${juego.title}">
          <div class="card-body">
            <h3 class="card-title">${juego.title}</h3>
            <div class="card-meta">${juego.platform || 'PKG'} • ${juego.size || 'N/A'}</div>
            ${juego.link ? `<a href="${juego.link}" target="_blank" class="download-btn">DESCARGAR</a>` : ''}
          </div>
        </div>
      `).join('');
    }

    function filtrarJuegos() {
      const query = document.getElementById('searchInput').value.toLowerCase();
      const filtrados = juegosData.filter(j => j.title && j.title.toLowerCase().includes(query));
      renderizar(filtrados);
    }

    async function guardarJuego(e) {
      e.preventDefault();
      const nuevoJuego = {
        id: parseInt(document.getElementById('gameId').value),
        title: document.getElementById('gameTitle').value,
        platform: document.getElementById('gamePlatform').value,
        size: document.getElementById('gameSize').value,
        imgUrl: document.getElementById('gameImg').value,
        link: document.getElementById('gameLink').value,
        desc: document.getElementById('gameDesc').value
      };

      const { error } = await supabaseClient.from('games').insert([nuevoJuego]);

      if (error) {
        alert('Error al guardar: ' + error.message);
      } else {
        alert('¡Juego publicado correctamente!');
        document.getElementById('gameForm').reset();
        toggleModal(false);
        cargarJuegos();
      }
    }

    function toggleModal(show) {
      document.getElementById('adminModal').classList.toggle('active', show);
    }
  </script>
</body>
</html>
