<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#030105">
<title>StoreXGamerPKG — Portal Neón Oficial</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Rajdhani:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
:root {
    --bg-dark: #030105;
    --panel-dark: #0b0512;
    --neon-cyan: #00f3ff;
    --neon-pink: #ff007f;
    --neon-purple: #bd00ff;
    --neon-glow-cyan: rgba(0, 243, 255, 0.4);
    --neon-glow-pink: rgba(255, 0, 127, 0.4);
    --text-light: #f3eef8;
    --text-muted: #9e91b0;
}

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: 'Inter', sans-serif;
}

html {
    scroll-behavior: smooth;
}

body {
    background-color: var(--bg-dark);
    color: var(--text-light);
    background-image: 
        radial-gradient(circle at 10% 20%, rgba(189, 0, 255, 0.15) 0%, transparent 40%),
        radial-gradient(circle at 90% 80%, rgba(0, 243, 255, 0.12) 0%, transparent 40%);
    min-height: 100vh;
    position: relative;
    overflow-x: hidden;
}

/* LÍNEA SUPERIOR RGB */
.topline {
    position: relative;
    z-index: 10;
    height: 4px;
    background: linear-gradient(90deg, var(--neon-cyan), var(--neon-purple), var(--neon-pink), var(--neon-cyan));
    background-size: 200% 100%;
    animation: rgbGlowLine 3s infinite linear;
    box-shadow: 0 0 20px var(--neon-cyan), 0 0 40px var(--neon-pink);
}

@keyframes rgbGlowLine {
    0% { background-position: 0% 50%; }
    100% { background-position: 200% 50%; }
}

header {
    position: sticky;
    top: 0;
    z-index: 1000;
    background: rgba(3, 1, 5, 0.9);
    backdrop-filter: blur(16px);
    border-bottom: 1px solid rgba(0, 243, 255, 0.3);
}

.nav-container {
    max-width: 1200px;
    margin: 0 auto;
    padding: 0.8rem 1.5rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
}

.brand {
    display: flex;
    align-items: center;
    gap: 12px;
}

.brand img {
    width: 48px;
    height: 48px;
    object-fit: contain;
    border-radius: 10px;
    border: 2px solid var(--neon-cyan);
    box-shadow: 0 0 15px var(--neon-cyan);
}

.brand-text h1 {
    font-family: 'Orbitron', sans-serif;
    font-size: 1.3rem;
    font-weight: 800;
    color: #fff;
    text-shadow: 0 0 10px var(--neon-glow-cyan);
}

.brand-text h1 span {
    color: var(--neon-cyan);
}

.brand-text small {
    display: block;
    font-size: 0.65rem;
    color: var(--neon-pink);
    letter-spacing: 2.5px;
    font-family: 'Rajdhani', sans-serif;
    font-weight: 700;
}

.nav-links {
    display: flex;
    gap: 2rem;
    font-weight: 700;
    font-size: 0.95rem;
    font-family: 'Rajdhani', sans-serif;
}

.nav-links a {
    color: var(--text-muted);
    transition: 0.3s;
}

.nav-links a:hover {
    color: var(--neon-cyan);
    text-shadow: 0 0 12px var(--neon-cyan);
}

.btn-admin {
    background: rgba(0, 243, 255, 0.1);
    border: 1px solid var(--neon-cyan);
    color: var(--neon-cyan);
    padding: 0.5rem 1.1rem;
    border-radius: 8px;
    font-weight: 700;
    font-family: 'Rajdhani', sans-serif;
    cursor: pointer;
    transition: 0.3s;
    box-shadow: 0 0 10px rgba(0, 243, 255, 0.2);
}

.btn-admin:hover {
    background: var(--neon-cyan);
    color: var(--bg-dark);
    box-shadow: 0 0 20px var(--neon-cyan);
}

/* PORTADA GAMER CON ESTILO PLAYSTATION Y NEÓN */
.hero-epic {
    max-width: 1200px;
    margin: 2rem auto;
    padding: 0 1.5rem;
}

.epic-banner {
    position: relative;
    border-radius: 20px;
    overflow: hidden;
    border: 2px solid var(--neon-cyan);
    box-shadow: 0 0 35px rgba(0, 243, 255, 0.3);
    min-height: 420px;
    display: flex;
    align-items: center;
    background: linear-gradient(135deg, rgba(7,17,48,0.9) 0%, rgba(3,8,23,0.95) 100%), 
                url('https://image.api.playstation.com/vulcan/img/rnd/202010/2917/lVPrvW9AyMplvmdXsJmcHoLz.png') center/cover no-repeat;
}

.epic-banner::before {
    content: "";
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at 75% 50%, rgba(189, 0, 255, 0.25) 0%, transparent 70%);
}

.epic-content {
    position: relative;
    z-index: 2;
    padding: 3.5rem;
    max-width: 650px;
}

.epic-badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: rgba(255, 0, 127, 0.2);
    border: 1px solid var(--neon-pink);
    color: var(--neon-pink);
    padding: 5px 14px;
    border-radius: 6px;
    font-size: 0.8rem;
    font-weight: 700;
    letter-spacing: 2px;
    margin-bottom: 1.2rem;
    font-family: 'Rajdhani', sans-serif;
    box-shadow: 0 0 10px var(--neon-glow-pink);
}

.epic-content h2 {
    font-family: 'Orbitron', sans-serif;
    font-size: 2.8rem;
    font-weight: 900;
    line-height: 1.15;
    margin-bottom: 1.2rem;
    color: #fff;
    text-shadow: 0 0 15px var(--neon-cyan), 0 0 30px var(--neon-purple);
}

.epic-content p {
    color: var(--text-muted);
    font-size: 1.05rem;
    margin-bottom: 2rem;
    line-height: 1.6;
}

.epic-btn {
    background: linear-gradient(135deg, var(--neon-cyan), var(--neon-purple));
    color: var(--bg-dark);
    border: none;
    padding: 0.85rem 2rem;
    border-radius: 8px;
    font-weight: 800;
    cursor: pointer;
    box-shadow: 0 0 20px var(--neon-cyan);
    transition: 0.3s;
    font-family: 'Rajdhani', sans-serif;
    letter-spacing: 1.5px;
    font-size: 1.1rem;
}

.epic-btn:hover {
    filter: brightness(1.2);
    transform: translateY(-3px);
    box-shadow: 0 0 30px var(--neon-cyan), 0 0 50px var(--neon-purple);
}

/* SECCIÓN PRINCIPAL */
.main-content {
    max-width: 1200px;
    margin: 0 auto;
    padding: 1.5rem 1.5rem 4rem 1.5rem;
}

.section-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    margin-bottom: 1.5rem;
    border-bottom: 2px solid rgba(0, 243, 255, 0.2);
    padding-bottom: 0.75rem;
}

.section-header h3 {
    font-family: 'Orbitron', sans-serif;
    font-size: 1.8rem;
    color: #fff;
    text-shadow: 0 0 10px var(--neon-glow-cyan);
}

/* SECCIONES DESTACADOS Y RECIÉN SUBIDOS */
.highlight-container {
    margin-bottom: 3rem;
}

.highlight-row {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 20px;
    margin-bottom: 2rem;
}

.filters-bar {
    display: flex;
    gap: 12px;
    margin-bottom: 2rem;
    flex-wrap: wrap;
}

.search-input, .select-input {
    background: var(--panel-dark);
    border: 1px solid var(--neon-cyan);
    color: var(--text-light);
    padding: 0.8rem 1rem;
    border-radius: 8px;
    outline: none;
    font-size: 0.95rem;
    transition: 0.3s;
}

.search-input {
    flex: 1;
    min-width: 240px;
}

.search-input:focus, .select-input:focus {
    border-color: var(--neon-pink);
    box-shadow: 0 0 15px var(--neon-glow-pink);
}

/* TARJETAS DE JUEGOS */
.game-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 20px;
}

.game-card {
    background: var(--panel-dark);
    border: 1px solid rgba(0, 243, 255, 0.3);
    border-radius: 12px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    transition: 0.3s;
    box-shadow: 0 10px 30px rgba(0,0,0,0.6);
}

.game-card:hover {
    transform: translateY(-6px);
    border-color: var(--neon-cyan);
    box-shadow: 0 15px 40px rgba(0, 243, 255, 0.3), 0 0 20px rgba(255, 0, 127, 0.3);
}

.game-img-container {
    height: 170px;
    background: url('https://image.api.playstation.com/vulcan/img/rnd/202010/2917/lVPrvW9AyMplvmdXsJmcHoLz.png') center/cover no-repeat;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
}

.game-img-container::before {
    content: "";
    position: absolute;
    inset: 0;
    background: rgba(3, 1, 5, 0.7);
}

.game-icon-overlay {
    position: relative;
    z-index: 2;
    font-size: 3rem;
    color: var(--neon-cyan);
    filter: drop-shadow(0 0 12px var(--neon-cyan));
}

.game-badge {
    position: absolute;
    top: 10px;
    left: 10px;
    z-index: 3;
    background: rgba(3, 1, 5, 0.9);
    border: 1px solid var(--neon-cyan);
    color: var(--neon-cyan);
    padding: 4px 10px;
    border-radius: 6px;
    font-size: 0.75rem;
    font-weight: 700;
    font-family: 'Rajdhani', sans-serif;
}

.genre-tag {
    position: absolute;
    top: 10px;
    right: 10px;
    z-index: 3;
    background: rgba(255, 0, 127, 0.25);
    border: 1px solid var(--neon-pink);
    color: #ff99c8;
    padding: 3px 8px;
    border-radius: 6px;
    font-size: 0.7rem;
    font-weight: 700;
}

.status-badge {
    position: absolute;
    bottom: 10px;
    left: 10px;
    z-index: 3;
    background: rgba(189, 0, 255, 0.3);
    border: 1px solid var(--neon-purple);
    color: #e0d0ff;
    padding: 2px 8px;
    border-radius: 4px;
    font-size: 0.65rem;
    font-weight: 700;
}

.game-info {
    padding: 1.25rem;
    display: flex;
    flex-direction: column;
    flex: 1;
}

.game-info h4 {
    font-size: 1.15rem;
    margin-bottom: 6px;
    font-weight: 700;
    font-family: 'Rajdhani', sans-serif;
    color: #fff;
}

.game-info p {
    color: var(--text-muted);
    font-size: 0.85rem;
    margin-bottom: 1rem;
    flex: 1;
}

.game-meta {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 0.8rem;
    color: var(--text-muted);
    border-top: 1px solid rgba(0, 243, 255, 0.15);
    padding-top: 10px;
}

.btn-download {
    background: rgba(0, 243, 255, 0.15);
    color: var(--neon-cyan);
    border: 1px solid var(--neon-cyan);
    padding: 6px 14px;
    border-radius: 6px;
    font-weight: 700;
    font-size: 0.85rem;
    cursor: pointer;
    transition: 0.2s;
    box-shadow: 0 0 8px rgba(0,243,255,0.2);
}

.btn-download:hover {
    background: var(--neon-cyan);
    color: var(--bg-dark);
    box-shadow: 0 0 15px var(--neon-cyan);
}

/* COMUNIDAD */
.community-section {
    max-width: 12
